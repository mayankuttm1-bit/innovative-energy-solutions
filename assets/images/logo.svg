<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" fill="none" class="w-full h-auto">
  <!-- Geometric Solar Emblem -->
  <g transform="translate(4, 4)">
    <!-- Outer Shield / Hexagonal Solar Cell -->
    <rect x="2" y="2" width="52" height="52" rx="14" fill="#0B131F"/>
    
    <!-- Sun Ray / Energy Prism (Solid Premium Colors) -->
    <circle cx="28" cy="28" r="11" fill="#F59E0B"/>
    <circle cx="28" cy="28" r="7" fill="#0B131F"/>
    <circle cx="28" cy="28" r="4" fill="#F59E0B"/>
    
    <!-- 8 Geometrical Solar Panels / Photovoltaic Blades -->
    <path d="M28 8 V13" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M28 43 V48" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M8 28 H13" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M43 28 H48" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M14 14 L17.5 17.5" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M38.5 38.5 L42 42" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M14 42 L17.5 38.5" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M38.5 17.5 L42 14" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Clean Energy Spark (Eco Green Dot) -->
    <circle cx="44" cy="12" r="3" fill="#10B981"/>
  </g>
  
  <!-- Wordmark Text -->
  <g transform="translate(70, 10)">
    <!-- INNOVATIVE -->
    <text x="0" y="24" font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', sans-serif" font-weight="900" font-size="21" letter-spacing="0.08em" fill="#0B131F">INNOVATIVE</text>
    <!-- ENERGY SOLUTIONS -->
    <text x="0" y="42" font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', sans-serif" font-weight="700" font-size="10.5" letter-spacing="0.28em" fill="#D97706">ENERGY SOLUTIONS</text>
    <!-- UJJAIN BADGE -->
    <rect x="178" y="10" width="62" height="18" rx="4" fill="#F1F5F9" stroke="#E2E8F0"/>
    <text x="209" y="22.5" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="9" letter-spacing="0.1em" fill="#475569">UJJAIN</text>
  </g>
</svg>
